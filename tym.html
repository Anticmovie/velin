<!DOCTYPE html><html lang="cs"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Recepce · Zprávy hostům</title>
<meta name="theme-color" content="#f6f4ef">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Recepce">

<style>
/* Airbnb design language (awesome-design-md/airbnb): bily canvas, ink #222, akcent Rausch, jeden stin */
:root{
  --bg:#ffffff;--bg2:#f7f7f7;--bg3:#f2f2f2;--line:#ebebeb;--line2:#dddddd;
  --txt:#222222;--dim:#6a6a6a;--dim2:#929292;
  --ab:#ff385c;--bk:#0057d8;--pos:#008a05;--posbg:#e8f4e9;
  --warn:#c67b00;--warnbg:#fdf3e0;--newc:#ff385c;--newbg:#ffecef;
  --ink:#222222;--grn:#ff385c;--rausch:#ff385c;--rausch-active:#e00b41;
  --r:14px;--sh:rgba(0,0,0,.02) 0 0 0 1px, rgba(0,0,0,.04) 0 2px 6px 0, rgba(0,0,0,.1) 0 4px 8px 0;
  --ease-out:cubic-bezier(.23,1,.32,1);
  --ease-drawer:cubic-bezier(.32,.72,0,1);
  --serif:'Inter',sans-serif;
  --sans:'Inter',Circular,-apple-system,system-ui,'Segoe UI',sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--txt);
  font-family:var(--sans);
  overscroll-behavior:none;font-size:15px;-webkit-font-smoothing:antialiased}
button{font-family:inherit}
.hide{display:none!important}
::-webkit-scrollbar{width:9px;height:9px}
::-webkit-scrollbar-thumb{background:#d9d2c2;border-radius:5px;border:2px solid transparent;background-clip:content-box}
::-webkit-scrollbar-track{background:transparent}

/* ============ PIN ============ */
#pin{position:fixed;inset:0;background:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;z-index:100;padding:24px}
#pin .logo{font-size:48px}
#pin h1{font-size:28px;margin:0;font-weight:700;letter-spacing:-.4px}
#pin h1 em,.lhead h1 em{font-style:normal;color:var(--rausch)}
#pin p{margin:0;color:var(--dim);font-size:14px}
#pin input{border:1px solid var(--line2);background:#fff;color:var(--txt);font-size:24px;text-align:center;letter-spacing:8px;padding:14px 18px;border-radius:8px;width:220px;outline:none;transition:border-color 150ms ease}
#pin input:focus{border:2px solid var(--ink);padding:13px 17px}
#pin button{background:var(--rausch);color:#fff;border:none;padding:14px 38px;border-radius:8px;font-size:16px;font-weight:500;cursor:pointer;transition:transform 160ms var(--ease-out),background 150ms ease}
#pin button:active{transform:scale(.97);background:var(--rausch-active)}

/* ============ LAYOUT ============ */
#app{display:grid;grid-template-columns:408px minmax(0,1fr) 348px;height:100dvh;height:100vh;background:var(--bg2)}
.pane{min-width:0;display:flex;flex-direction:column;min-height:0;background:var(--bg)}
#paneList{border-right:1px solid var(--line)}
#paneThread{background:var(--bg2)}
#paneDetail{border-left:1px solid var(--line)}
@media(max-width:1280px){#app{grid-template-columns:390px minmax(0,1fr)}#paneDetail{position:fixed;right:0;top:0;bottom:0;width:min(370px,94vw);z-index:40;box-shadow:-16px 0 60px rgba(0,0,0,.16);transform:translateX(105%);transition:transform .28s cubic-bezier(.2,.8,.2,1);background:var(--bg)}
  #paneDetail.open{transform:none}}
@media(max-width:780px){
  #app{grid-template-columns:1fr}
  /* Slide in vlakna: iOS drawer curve (emil skill --ease-drawer) */
  #paneThread{position:fixed;inset:0;z-index:30;transform:translateX(100%);transition:transform 320ms var(--ease-drawer)}
  #paneThread.open{transform:none}
}
@media(prefers-reduced-motion:reduce){
  #paneThread{transition:opacity 200ms ease;transform:none;opacity:0;pointer-events:none}
  #paneThread.open{opacity:1;pointer-events:auto}
}

/* ============ LIST PANE ============ */
.lhead{padding:calc(env(safe-area-inset-top) + 20px) 22px 6px}
.lhead .row{display:flex;align-items:baseline;gap:10px}
.lhead h1{font-size:28px;font-weight:700;margin:0;letter-spacing:-.4px;flex:1}
.dot{width:8px;height:8px;border-radius:50%;background:var(--dim2);flex:none;align-self:center}
.dot.on{background:var(--pos);box-shadow:0 0 0 3px var(--posbg)}
#hcount{font-size:12.5px;color:var(--dim);font-weight:500}
/* dnesni provoz */
#todaybar{display:flex;gap:7px;padding:12px 20px 0;overflow-x:auto;scrollbar-width:none}
#todaybar::-webkit-scrollbar{display:none}
.tb{flex:none;display:flex;align-items:center;gap:8px;background:var(--bg2);border:1px solid var(--line);border-radius:14px;padding:8px 13px;font-size:12.5px;font-weight:600;color:var(--dim)}
.tb b{font-family:var(--serif);font-size:19px;color:var(--txt);font-weight:600}
.tb.hot{background:var(--warnbg);border-color:#ecd9b4;color:var(--warn)}
.tb.hot b{color:var(--warn)}
#search{margin:12px 20px 4px;display:flex;align-items:center;gap:10px;background:var(--bg2);border:1px solid transparent;border-radius:26px;padding:11px 17px;transition:all .15s}
#search:focus-within{background:#fff;border-color:var(--line2);box-shadow:var(--sh)}
#search svg{flex:none;opacity:.5}
#search input{border:none;background:none;outline:none;font-size:14.5px;width:100%;color:var(--txt);font-family:inherit}
.filters{display:flex;gap:7px;padding:12px 20px 10px;overflow-x:auto;scrollbar-width:none}
.filters::-webkit-scrollbar{display:none}
.chip{background:#fff;border:1px solid var(--line2);color:var(--txt);padding:8px 15px;border-radius:22px;font-size:13px;white-space:nowrap;cursor:pointer;font-weight:500;transition:border-color 150ms ease,transform 160ms var(--ease-out),background 150ms ease}
.chip:active{transform:scale(.96)}
@media(hover:hover) and (pointer:fine){ .chip:hover{border-color:var(--ink)} }
.chip.on{background:var(--ink);color:#fff;border-color:var(--ink)}
#list{flex:1;overflow-y:auto;padding:2px 12px 24px}
.sect{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:8px;padding:12px 10px 8px;background:linear-gradient(180deg,#fff 78%,rgba(255,255,255,0));font-size:12px;font-weight:800;letter-spacing:.7px;text-transform:uppercase}
.sect.wait{color:var(--warn)}
.sect.ok{color:var(--dim)}
.sect .cnt{background:var(--warnbg);color:var(--warn);border-radius:10px;padding:1px 8px;font-size:11.5px;letter-spacing:0}
.sect.ok .cnt{background:var(--bg2);color:var(--dim)}
.conv{display:flex;gap:13px;padding:13px 12px;border-radius:var(--r);cursor:pointer;align-items:flex-start;position:relative;transition:background .12s;border:1px solid transparent}
.conv:hover{background:var(--bg2)}
.conv.sel{background:#fff;border-color:var(--line);box-shadow:var(--sh)}
.conv.act{background:linear-gradient(135deg,#fdf3e0,#fff);border-color:#f2dfb8}
.conv.act:hover{background:linear-gradient(135deg,#fae9cd,#fff)}
.ava{width:52px;height:52px;border-radius:50%;flex:none;display:flex;align-items:center;justify-content:center;font-size:18px;font-weight:800;color:#fff;position:relative;letter-spacing:.5px;box-shadow:inset 0 -10px 18px rgba(0,0,0,.12)}
.ava .pf{position:absolute;bottom:-3px;right:-5px;width:22px;height:22px;border-radius:50%;border:2.5px solid #fff;font-size:10.5px;font-weight:900;display:flex;align-items:center;justify-content:center;color:#fff;box-shadow:0 1px 3px rgba(0,0,0,.18)}
.cmid{flex:1;min-width:0}
.cmid .r1{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.cmid .nm{font-weight:700;font-size:15.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cmid .tm{font-size:12px;color:var(--dim);flex:none;font-weight:500}
.conv.act .tm{color:var(--warn);font-weight:700}
.cmid .ls{font-size:13.5px;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:3px;line-height:1.35}
.cmid .ls b{color:var(--txt);font-weight:600}
.conv.unrd .ls{color:var(--txt);font-weight:600}
.meta{display:flex;align-items:center;gap:5px;margin-top:7px;flex-wrap:wrap}
.chipm{font-size:11.5px;font-weight:700;padding:3.5px 9px;border-radius:9px;white-space:nowrap;max-width:180px;overflow:hidden;text-overflow:ellipsis;display:inline-flex;align-items:center;gap:4px}
.chipm.apt{border:1px solid transparent}
.chipm.dt{background:var(--bg2);color:var(--dim)}
.chipm.dt.instay{background:var(--posbg);color:var(--pos)}
.chipm.dt.today{background:var(--warnbg);color:var(--warn)}
.chipm.wait{background:var(--warnbg);color:var(--warn)}
.chipm.new{background:var(--newc);color:#fff}
.bdg{position:absolute;top:14px;right:12px;min-width:20px;height:20px;border-radius:10px;background:var(--newc);color:#fff;font-size:11px;font-weight:800;display:flex;align-items:center;justify-content:center;padding:0 6px}
.empty{color:var(--dim);text-align:center;padding:60px 24px;font-size:14.5px;line-height:1.6}

/* ============ THREAD PANE ============ */
.thead{display:flex;align-items:center;gap:13px;padding:calc(env(safe-area-inset-top) + 14px) 20px 13px;border-bottom:1px solid var(--line);background:#fff}
.iconbtn{width:38px;height:38px;border-radius:50%;border:none;background:var(--bg3);color:var(--txt);font-size:16px;cursor:pointer;display:flex;align-items:center;justify-content:center;flex:none;transition:background 150ms ease,transform 160ms var(--ease-out)}
.iconbtn:active{transform:scale(.94)}
@media(hover:hover) and (pointer:fine){ .iconbtn:hover{background:var(--line)} }
.thead .back{display:none}
@media(max-width:780px){.thead .back{display:flex}}
.thead .ava{width:44px;height:44px;font-size:16px}
.thead .tt{flex:1;min-width:0}
.thead .tt .n{font-weight:800;font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:flex;align-items:center;gap:8px}
.thead .tt .n .st{font-size:11px;font-weight:800;padding:3px 9px;border-radius:9px}
.thead .tt .n .st.wait{background:var(--warnbg);color:var(--warn)}
.thead .tt .n .st.new{background:var(--newc);color:#fff}
.thead .tt .n .st.done{background:var(--posbg);color:var(--pos)}
.thead .sub{display:flex;align-items:center;gap:5px;margin-top:4px;flex-wrap:nowrap;overflow:hidden}
#msgs{flex:1;overflow-y:auto;padding:22px 24px 12px;display:flex;flex-direction:column;gap:3px}
.dsep{display:flex;align-items:center;gap:14px;margin:18px 0 12px;color:var(--dim);font-size:12px;font-weight:700}
.dsep::before,.dsep::after{content:'';flex:1;height:1px;background:var(--line2);opacity:.6}
.grp{display:flex;gap:10px;max-width:min(82%,640px)}
.grp.in{align-self:flex-start}
.grp.out{align-self:flex-end}
.grp .gava{width:32px;height:32px;border-radius:50%;flex:none;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:800;color:#fff;margin-top:22px}
.gcol{display:flex;flex-direction:column;min-width:0}
.grp.out .gcol{align-items:flex-end}
.mcap{font-size:11.5px;color:var(--dim);margin:10px 6px 5px;display:flex;gap:7px;align-items:baseline}
.mcap b{color:var(--txt);font-weight:750;font-size:12.5px}
.b{padding:11px 16px;border-radius:20px;font-size:14.8px;line-height:1.45;white-space:pre-wrap;word-break:break-word;margin-top:2.5px}
.grp.in .b{background:#fff;border:1px solid var(--line);border-bottom-left-radius:7px;box-shadow:var(--sh)}
.grp.out .b{background:var(--ink);color:#fff;border-bottom-right-radius:7px}
.grp.pend .b{opacity:.55}
.pendtxt{font-size:11px;color:var(--dim);margin-top:4px}
.trx{font-size:11px;color:var(--dim);margin-top:5px;padding:0 5px;cursor:pointer;user-select:none;font-weight:600}
.trx:hover{color:var(--txt)}
.b .orig{display:block;margin-top:8px;padding-top:8px;border-top:1px dashed rgba(128,128,128,.4);opacity:.75;font-size:13.5px}
.langbar{display:flex;align-items:center;gap:10px;padding:9px 22px 0;font-size:12.5px;color:var(--dim)}
.langbar .sw{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line2);background:#fff;border-radius:18px;padding:6px 13px;cursor:pointer;font-weight:700;color:var(--txt)}
.langbar .sw.on{background:var(--posbg);border-color:#bcd8c6;color:var(--pos)}
.composer{display:flex;gap:10px;padding:12px 20px calc(env(safe-area-inset-bottom) + 16px);align-items:flex-end}
.composer .box{flex:1;display:flex;align-items:flex-end;background:#fff;border:1.5px solid var(--line2);border-radius:24px;transition:all .15s;box-shadow:var(--sh)}
.composer .box:focus-within{border-color:var(--grn)}
.composer textarea{flex:1;background:none;border:none;color:var(--txt);padding:12px 18px;font-size:15px;resize:none;max-height:130px;outline:none;font-family:inherit;line-height:1.4}
/* odesilaci orb = Airbnb search-orb (Rausch kruh 46px) */
.composer button{background:var(--rausch);border:none;color:#fff;width:46px;height:46px;border-radius:50%;flex:none;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:transform 160ms var(--ease-out),background 150ms ease}
@media(hover:hover) and (pointer:fine){ .composer button:hover{transform:scale(1.05)} }
.composer button:active{transform:scale(.94);background:var(--rausch-active)}
#noconv{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;color:var(--dim)}
#noconv .big{font-size:56px;filter:grayscale(.2)}
#noconv .t{font-family:var(--serif);font-size:19px;font-weight:600;color:var(--txt)}

/* ============ DETAIL PANE ============ */
.dhead{display:flex;align-items:center;gap:10px;padding:calc(env(safe-area-inset-top) + 18px) 22px 10px}
.dhead h2{font-family:var(--serif);font-size:18px;font-weight:600;margin:0;flex:1}
#detail{flex:1;overflow-y:auto;padding:4px 20px 28px}
.dprof{text-align:center;padding:16px 0 18px}
.dprof .ava{width:88px;height:88px;font-size:31px;margin:0 auto}
.dprof .n{font-family:var(--serif);font-size:23px;font-weight:600;margin-top:13px}
.dprof .s{font-size:13.5px;color:var(--dim);margin-top:5px;font-weight:500}
.card{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:16px;margin-top:12px;box-shadow:var(--sh)}
.card .lbl{font-size:10.5px;font-weight:800;color:var(--dim);text-transform:uppercase;letter-spacing:.8px}
.cico{display:grid;grid-template-columns:1fr 1fr}
.cico>div{padding:2px 6px}
.cico>div:first-child{border-right:1px solid var(--line)}
.cico .v{font-family:var(--serif);font-size:19px;font-weight:600;margin-top:6px}
.cico .w{font-size:12.5px;color:var(--dim);margin-top:2px}
.krow{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:9.5px 0;border-bottom:1px solid var(--line);font-size:14px}
.krow:last-child{border-bottom:none;padding-bottom:2px}
.krow:first-child{padding-top:2px}
.krow .k{color:var(--dim);font-weight:500}
.krow .v{font-weight:700;text-align:right;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.krow .v.mono{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12.5px;background:var(--bg2);padding:3px 8px;border-radius:8px}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:12.5px;font-weight:800;padding:6px 13px;border-radius:12px}
.pill.pl-booking{background:#e7eff8;color:var(--bk)}
.pill.pl-airbnb{background:var(--newbg);color:var(--ab)}
.pill.ok{background:var(--posbg);color:var(--pos)}
.pill.warn{background:var(--warnbg);color:var(--warn)}
.pill.new{background:var(--newc);color:#fff}
.hlcard{margin-top:12px;border-radius:var(--r);padding:14px 16px;font-weight:800;text-align:center;font-size:14.5px}
.hlcard.today{background:linear-gradient(135deg,#fdf3e0,#fae9cd);color:var(--warn)}
.hlcard.instay{background:linear-gradient(135deg,#e8f4e9,#daecdb);color:var(--pos)}
</style></head><body>

<div id="pin"><div class="logo">🛎️</div><h1>Recep<em>ce</em></h1><p>Zprávy hostům &amp; dnešní provoz</p><input id="pinv" type="tel" inputmode="numeric" placeholder="PIN" maxlength="10"><button onclick="tryPin()">Vstoupit</button></div>

<div id="app">
  <!-- ===== SEZNAM ===== -->
  <div class="pane" id="paneList">
    <div class="lhead"><div class="row"><h1>Recep<em>ce</em></h1><span class="dot" id="rt"></span><span id="hcount"></span></div></div>
    <div id="todaybar"></div>
    <div id="search"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg><input id="q" placeholder="Hledat hosta nebo byt…" oninput="renderList()"></div>
    <div class="filters" id="filters"></div>
    <div id="list"></div>
  </div>

  <!-- ===== VLÁKNO ===== -->
  <div class="pane" id="paneThread">
    <div id="noconv"><div class="big">🛎️</div><div class="t">Vyber konverzaci</div><div style="font-size:13.5px">Odpověď hostovi dorazí rovnou na Booking / Airbnb</div></div>
    <div id="twrap" class="hide" style="display:flex;flex-direction:column;flex:1;min-height:0">
      <div class="thead">
        <button class="iconbtn back" onclick="closeThread()">‹</button>
        <div class="ava" id="tava"></div>
        <div class="tt"><div class="n" id="tname"></div><div class="sub" id="tsub"></div></div>
        <button class="iconbtn" title="Detail rezervace" onclick="toggleDetail()">ⓘ</button>
      </div>
      <div id="msgs"></div>
      <div class="langbar hide" id="langbar">

        <div class="box"><textarea id="reply" rows="1" placeholder="Napiš zprávu…" oninput="grow(this)"></textarea></div>
        <button id="sendbtn" onclick="sendReply()" title="Odeslat"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="m22 2-7 20-4-9-9-4z"/><path d="M22 2 11 13"/></svg></button>
      </div>
    </div>
  </div>

  <!-- ===== DETAIL REZERVACE ===== -->
  <div class="pane" id="paneDetail">
    <div class="dhead"><h2>Rezervace</h2><button class="iconbtn" onclick="toggleDetail(false)" style="font-size:14px">✕</button></div>
    <div id="detail"><div class="empty">Vyber konverzaci</div></div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>

const PNAME={booking:'Booking.com',airbnb:'Airbnb'};
const LANGS={en:'angličtině',de:'němčině',ru:'ruštině',uk:'ukrajinštině',pl:'polštině',es:'španělštině',fr:'francouzštině',it:'italštině','zh-cn':'čínštině','zh-tw':'čínštině',zh:'čínštině',ko:'korejštině',ja:'japonštině',nl:'nizozemštině',pt:'portugalštině',tr:'turečtině',ro:'rumunštině',hu:'maďarštině',el:'řečtině',lv:'lotyštině',lt:'litevštině',he:'hebrejštině',iw:'hebrejštině',ar:'arabštině',da:'dánštině',sv:'švédštině',no:'norštině',fi:'finštině',et:'estonštině',hr:'chorvatštině',sr:'srbštině',bg:'bulharštině',ka:'gruzínštině',hy:'arménštině',az:'ázerbájdžánštině',hi:'hindštině',id:'indonéštině',vi:'vietnamštině',th:'thajštině'};
const LANGZ={en:'angličtiny',de:'němčiny',ru:'ruštiny',uk:'ukrajinštiny',pl:'polštiny',es:'španělštiny',fr:'francouzštiny',it:'italštiny','zh-cn':'čínštiny','zh-tw':'čínštiny',zh:'čínštiny',ko:'korejštiny',ja:'japonštiny',nl:'nizozemštiny',pt:'portugalštiny',tr:'turečtiny',ro:'rumunštiny',hu:'maďarštiny',el:'řečtiny',lv:'lotyštiny',lt:'litevštiny',he:'hebrejštiny',iw:'hebrejštiny',ar:'arabštiny',da:'dánštiny',sv:'švédštiny',no:'norštiny',fi:'finštiny',et:'estonštiny',hr:'chorvatštiny',sr:'srbštiny',bg:'bulharštiny'};
const langName=(l,z)=> (z?LANGZ:LANGS)[(l||'').toLowerCase()] || (l||'').toUpperCase();
async function gtx(text,tl,sl){
  const r=await fetch('https://translate.googleapis.com/translate_a/single?client=gtx&sl='+(sl||'auto')+'&tl='+tl+'&dt=t',{method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded'},body:'q='+encodeURIComponent(text)});
  if(!r.ok)throw new Error('translate '+r.status);
  const j=await r.json();
  return {text:(j[0]||[]).map(s=>s[0]).join(''),lang:(j[2]||'').toLowerCase()};
}
const el=id=>document.getElementById(id);
const esc=s=>(s||'').replace(/[&<>]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[m]));
const initials=s=>(s||'?').trim().split(/\s+/).slice(0,2).map(x=>x[0]).join('').toUpperCase();
const avaStyle=c=>`background:linear-gradient(140deg,${PCOL[c.platform]||'#888'},#4a4436)`;
function hue(s){ let h=0; for(const ch of (s||'')) h=(h*31+ch.charCodeAt(0))>>>0; return h%360; }
function aptChip(c,extra){ const k=c.byt_key||c.byt_nazev||'?', h=hue(k);
  return `<span class="chipm apt" style="background:hsl(${h},58%,93%);color:hsl(${h},48%,30%);border-color:hsl(${h},42%,85%)">🏠 ${esc(c.byt_nazev||k)}</span>${extra||''}`; }

function tryPin(){ if(el('pinv').value.trim()===PIN){ el('pin').classList.add('hide'); localStorage.velintym='1'; boot(); } else { el('pinv').value=''; el('pinv').placeholder='špatný PIN'; } }
el('pinv').addEventListener('keydown',e=>{if(e.key==='Enter')tryPin();});

/* ---------- format ---------- */
const DAYS=['neděle','pondělí','úterý','středa','čtvrtek','pátek','sobota'];
function relT(iso){ if(!iso)return''; const d=new Date(iso),n=Date.now(),df=n-d.getTime();
  if(df<60e3)return 'teď';
  if(df<3600e3)return 'před '+Math.floor(df/60e3)+' min';
  if(d.toDateString()===new Date().toDateString())return d.toLocaleTimeString('cs',{hour:'2-digit',minute:'2-digit'});
  const y=new Date(); y.setDate(y.getDate()-1);
  if(d.toDateString()===y.toDateString())return 'včera';
  if(df<6*864e5)return DAYS[d.getDay()];
  return d.getDate()+'. '+(d.getMonth()+1)+'.'; }
function fmtClock(iso){ return iso? new Date(iso).toLocaleTimeString('cs',{hour:'2-digit',minute:'2-digit'}):''; }
function fmtD(iso){ if(!iso)return''; const d=new Date(iso+'T12:00'); return d.getDate()+'.'+(d.getMonth()+1)+'.'; }
function fmtDFull(iso){ if(!iso)return''; const d=new Date(iso+'T12:00'); return DAYS[d.getDay()]+' '+d.getDate()+'. '+(d.getMonth()+1)+'. '+d.getFullYear(); }
function nights(a,b){ if(!a||!b)return null; return Math.round((new Date(b+'T12:00')-new Date(a+'T12:00'))/864e5); }
function dsepLabel(iso){ const d=new Date(iso),n=new Date();
  if(d.toDateString()===n.toDateString())return 'Dnes';
  const y=new Date(n); y.setDate(n.getDate()-1);
  if(d.toDateString()===y.toDateString())return 'Včera';
  return d.toLocaleDateString('cs',{weekday:'long',day:'numeric',month:'long'}); }
function grow(t){t.style.height='auto';t.style.height=Math.min(t.scrollHeight,130)+'px';}

function pobyt(c){
  if(!c.prijezd)return null; const t=new Date().toISOString().slice(0,10);
  const r=fmtD(c.prijezd)+'–'+fmtD(c.odjezd);
  if(c.prijezd===t) return {cls:'today',t:'🔑 dnes check-in',r};
  if(c.odjezd===t) return {cls:'today',t:'👋 dnes check-out',r};
  if(c.prijezd<t&&(c.odjezd||'9999')>t) return {cls:'instay',t:'🏠 v bytě · do '+fmtD(c.odjezd),r};
  if(c.prijezd>t){ const dn=nights(t,c.prijezd); return {cls:'',t:'📅 '+r+(dn<=7?' · za '+dn+' d':''),r}; }
  return {cls:'',t:'📅 '+r,r};
}
function stav(c){
  if(c.unread>0) return {pill:'new',t:c.unread>1?c.unread+' nové':'nová zpráva'};
  if(c.posledni_smer==='in') return {pill:'wait',t:'⏳ čeká na odpověď'};
  return null;
}
const needsAction=c=> c.unread>0 || c.posledni_smer==='in';

/* ---------- boot + data ---------- */
async function boot(){
  sb=supabase.createClient(SB_URL,SB_KEY);
  await loadConvs();
  sb.channel('rt').on('postgres_changes',{event:'*',schema:'public',table:'zpravy'},()=>{ if(curId)openConv(curId,true); loadConvs(); })
    .on('postgres_changes',{event:'*',schema:'public',table:'konverzace'},()=>loadConvs())
    .subscribe(st=>{ el('rt').classList.toggle('on',st==='SUBSCRIBED'); });
}
async function loadConvs(){
  const {data,error}=await sb.from('konverzace').select('*').order('last_at',{ascending:false,nullsFirst:false});
  if(error){ el('list').innerHTML='<div class="empty">Chyba připojení:<br>'+esc(error.message)+'</div>'; return; }
  CONVS=data||[]; renderToday(); renderFilters(); renderList();
}

/* ---------- dnesni provoz ---------- */
function renderToday(){
  const t=new Date().toISOString().slice(0,10);
  const arr=CONVS.filter(c=>c.prijezd===t), dep=CONVS.filter(c=>c.odjezd===t);
  const stay=CONVS.filter(c=>c.prijezd&&c.prijezd<t&&c.odjezd&&c.odjezd>t);
  const wait=CONVS.filter(needsAction).length;
  el('todaybar').innerHTML=
    `<span class="tb ${wait?'hot':''}">⏳ <b>${wait}</b> čeká</span>`+
    `<span class="tb">🔑 <b>${arr.length}</b> příjezd${arr.length===1?'':'y'}</span>`+
    `<span class="tb">👋 <b>${dep.length}</b> odjezd${dep.length===1?'':'y'}</span>`+
    `<span class="tb">🏠 <b>${stay.length}</b> v bytech</span>`;
}

/* ---------- list ---------- */
function renderFilters(){
  const byty=[...new Set(CONVS.map(c=>c.byt_nazev).filter(Boolean))].sort((a,b)=>a.localeCompare(b,'cs'));
  const na=CONVS.filter(needsAction).length;
  const chips=[['vse','Vše'],['ceka','⏳ Čeká '+na],['dnes','🔑 Dnešní pohyb'],['unread','Nepřečtené'],['p:booking','Booking'],['p:airbnb','Airbnb']].concat(byty.map(b=>['b:'+b,'🏠 '+b]));
  el('filters').innerHTML=chips.map(([k,l])=>`<span class="chip ${FILTER===k?'on':''}" onclick="setF('${(k+'').replace(/'/g,"\\'")}')">${l}</span>`).join('');
  el('hcount').textContent = na? na+' čeká na odpověď' : CONVS.length+' konverzací';
}
function setF(k){ FILTER=k; renderFilters(); renderList(); }
function convRow(c){
  const s=stav(c),p=pobyt(c);
  const pre=c.posledni_smer==='out'?'<b>My:</b> ':'';
  return `<div class="conv ${needsAction(c)?'act':''} ${c.unread>0?'unrd':''} ${c.id===curId?'sel':''}" onclick="openConv('${c.id}')">
    <div class="ava" style="${avaStyle(c)}">${initials(c.guest)}<span class="pf" style="background:${PCOL[c.platform]||'#888'}">${PICON[c.platform]||'?'}</span></div>
    <div class="cmid">
      <div class="r1"><span class="nm">${esc(c.guest||'Host')}</span><span class="tm">${relT(c.last_at)}</span></div>
      <div class="ls">${pre}${esc(c.last_text||'')}</div>
      <div class="meta">
        ${s?`<span class="chipm ${s.pill}">${s.t}</span>`:''}
        ${aptChip(c)}
        ${p?`<span class="chipm dt ${p.cls}">${p.t}</span>`:''}
      </div>
    </div>
    ${c.unread>0?`<span class="bdg">${c.unread}</span>`:''}
  </div>`;
}
function renderList(){
  const q=(el('q').value||'').toLowerCase().trim();
  const t=new Date().toISOString().slice(0,10);
  let list=CONVS.slice();
  if(FILTER==='unread') list=list.filter(c=>c.unread>0);
  else if(FILTER==='ceka') list=list.filter(needsAction);
  else if(FILTER==='dnes') list=list.filter(c=>c.prijezd===t||c.odjezd===t);
  else if(FILTER.startsWith('p:')) list=list.filter(c=>c.platform===FILTER.slice(2));
  else if(FILTER.startsWith('b:')) list=list.filter(c=>c.byt_nazev===FILTER.slice(2));
  if(q) list=list.filter(c=>((c.guest||'')+' '+(c.byt_nazev||'')+' '+(c.byt_key||'')).toLowerCase().includes(q));
  if(!list.length){ el('list').innerHTML='<div class="empty">Žádné konverzace<br>v tomto filtru.</div>'; return; }
  const byTime=(a,b)=>(b.last_at||'').localeCompare(a.last_at||'');
  const wait=list.filter(needsAction).sort(byTime);
  const done=list.filter(c=>!needsAction(c)).sort(byTime);
  let html='';
  if(wait.length) html+=`<div class="sect wait">⏳ Čeká na odpověď <span class="cnt">${wait.length}</span></div>`+wait.map(convRow).join('');
  if(done.length) html+=`<div class="sect ok">Vyřízené <span class="cnt">${done.length}</span></div>`+done.map(convRow).join('');
  el('list').innerHTML=html;
}

/* ---------- thread ---------- */
async function openConv(id,keep){
  curId=id; const c=CONVS.find(x=>x.id===id)||{};
  el('noconv').classList.add('hide'); el('twrap').classList.remove('hide');
  el('paneThread').classList.add('open');
  el('tava').style.cssText=avaStyle(c); el('tava').textContent=initials(c.guest);
  const s=stav(c),p=pobyt(c);
  el('tname').innerHTML=esc(c.guest||'Host')+(s?` <span class="st ${s.pill}">${s.t}</span>`:' <span class="st done">✓ odpovězeno</span>');
  el('tsub').innerHTML=aptChip(c, p?`<span class="chipm dt ${p.cls}">${p.t}</span>`:'')+`<span class="chipm" style="background:${c.platform==='booking'?'#e7eff8':'var(--newbg)'};color:${PCOL[c.platform]||'#888'}">${PNAME[c.platform]||c.platform}</span>`;
  renderDetail(c); renderLangbar(c);
  const {data}=await sb.from('zpravy').select('*').eq('konverzace_id',id).order('ts',{ascending:true});
  const msgs=data||[];
  const m=el('msgs'); let html='',lastDay='',lastSmer='';
  for(const z of msgs){
    const day=z.ts?new Date(z.ts).toDateString():'';
    if(day&&day!==lastDay){ html+=`<div class="dsep">${dsepLabel(z.ts)}</div>`; lastDay=day; lastSmer=''; }
    const showCap = z.smer!==lastSmer;
    lastSmer=z.smer;
    const author = z.smer==='out' ? 'My' : (z.author||c.guest||'Host');
    const hasTr = z.preklad && z.jazyk && z.jazyk!=='cs';
    const main = (z.smer==='in' && hasTr) ? z.preklad : z.msg;
    const other = (z.smer==='in' && hasTr) ? z.msg : (hasTr ? z.preklad : null);
    const trCap = hasTr ? (z.smer==='in' ? '🌐 přeloženo z '+langName(z.jazyk,1) : '🌐 posláno v '+langName(z.jazyk)) : '';
    html+=`<div class="grp ${z.smer==='out'?'out':'in'} ${z.stav==='pending'?'pend':''}">
      ${z.smer==='in'&&showCap?`<div class="gava" style="${avaStyle(c)}">${initials(author)}</div>`:(z.smer==='in'?'<div class="gava" style="visibility:hidden"></div>':'')}
      <div class="gcol">
        ${showCap?`<div class="mcap"><b>${esc(author)}</b><span>${fmtClock(z.ts)}</span></div>`:''}
        <div class="b">${esc(main)}${other?`<span class="orig hide">${esc(other)}</span>`:''}</div>
        ${hasTr?`<div class="trx" onclick="this.previousElementSibling.querySelector('.orig').classList.toggle('hide')">${trCap} · originál</div>`:''}
        ${z.stav==='pending'?'<div class="pendtxt">odesílá se…</div>':''}
      </div>
    </div>`;
  }
  m.innerHTML=html||'<div class="empty">Zatím žádné zprávy ve vlákně.</div>';
  m.scrollTop=m.scrollHeight;
  if(!keep){ renderList(); if(c.unread>0){ await sb.from('konverzace').update({unread:0}).eq('id',id); loadConvs(); } }
  translateMissing(c,msgs);
}
function closeThread(){ curId=null; el('paneThread').classList.remove('open'); el('twrap').classList.add('hide'); el('noconv').classList.remove('hide'); renderList(); }
function toggleDetail(force){ const d=el('paneDetail'); d.classList.toggle('open', force!==undefined?force:!d.classList.contains('open')); }

/* jazyk */
function guestLang(c){ const l=(c.jazyk||'').toLowerCase(); return (l&&l!=='cs'&&l!=='sk'&&l!=='??')?l:null; }
function renderLangbar(c){
  const l=guestLang(c);
  el('langbar').classList.toggle('hide',!l);
  if(l){ el('langname').textContent=langName(l); el('langsw').classList.toggle('on',TR_OUT);
    el('langhint').textContent=TR_OUT?'napiš česky — hostovi dorazí překlad':'odešle se přesně to, co napíšeš'; }
}
function toggleLang(){ TR_OUT=!TR_OUT; const c=CONVS.find(x=>x.id===curId); if(c)renderLangbar(c); }
async function translateMissing(c,msgs){
  const todo=msgs.filter(z=>z.smer==='in'&&!z.jazyk&&(z.msg||'').trim()).slice(-15);
  let done=0;
  for(const z of todo){
    try{
      const t=await gtx(z.msg.slice(0,4500),'cs');
      const jazyk=t.lang||'??';
      await sb.from('zpravy').update({jazyk,preklad:(jazyk==='cs'||!t.text||t.text===z.msg)?null:t.text}).eq('id',z.id);
      if(jazyk!=='cs'&&jazyk!=='??'&&!c.jazyk){ await sb.from('konverzace').update({jazyk}).eq('id',c.id); c.jazyk=jazyk; }
      done++;
    }catch(e){ break; }
  }
  if(done&&curId===c.id) openConv(c.id,true);
}

/* ---------- detail (bez adminovych odkazu — recepce nema pristup do extranetu) ---------- */
function renderDetail(c){
  const p=pobyt(c),s=stav(c),n=nights(c.prijezd,c.odjezd);
  el('detail').innerHTML=`
    <div class="dprof">
      <div class="ava" style="${avaStyle(c)}">${initials(c.guest)}</div>
      <div class="n">${esc(c.guest||'Host')}</div>
      <div class="s">${c.prijezd?fmtD(c.prijezd)+' – '+fmtD(c.odjezd)+(n?' · '+n+' '+(n===1?'noc':n<5?'noci':'nocí'):''):'termín neznámý'}</div>
      <div style="margin-top:12px;display:flex;gap:6px;justify-content:center;flex-wrap:wrap">
        <span class="pill pl-${c.platform}">${PICON[c.platform]} ${PNAME[c.platform]||c.platform}</span>
        ${s?`<span class="pill ${s.pill==='new'?'new':'warn'}">${s.t}</span>`:`<span class="pill ok">✓ odpovězeno</span>`}
      </div>
    </div>
    ${c.prijezd?`<div class="card"><div class="cico">
      <div><div class="lbl">Check-in</div><div class="v">${fmtD(c.prijezd)}</div><div class="w">${fmtDFull(c.prijezd)}</div></div>
      <div style="padding-left:16px"><div class="lbl">Check-out</div><div class="v">${fmtD(c.odjezd)||'—'}</div><div class="w">${fmtDFull(c.odjezd)}</div></div>
    </div></div>`:''}
    ${p&&(p.cls==='today'||p.cls==='instay')?`<div class="hlcard ${p.cls}">${p.t}</div>`:''}
    <div class="card">
      <div class="krow"><span class="k">Apartmán</span><span class="v">${aptChip(c)}</span></div>
      ${c.jazyk&&c.jazyk!=='cs'?`<div class="krow"><span class="k">Jazyk hosta</span><span class="v">🌐 ${langName(c.jazyk)}</span></div>`:''}
      ${c.reservation_code?`<div class="krow"><span class="k">Rezervace</span><span class="v mono">${esc(c.reservation_code)}</span></div>`:''}
      <div class="krow"><span class="k">Poslední zpráva</span><span class="v">${relT(c.last_at)}</span></div>
    </div>`;
}

/* ---------- odeslani ---------- */
async function sendReply(){
  const t=el('reply').value.trim(); if(!t||!curId)return;
  const c=CONVS.find(x=>x.id===curId)||{};
  el('reply').value=''; grow(el('reply'));
  let outMsg=t, orig=null, jazyk=null;
  const gl=guestLang(c);
  if(TR_OUT&&gl){
    try{ const tr=await gtx(t,gl,'cs'); if(tr.text&&tr.text.trim()&&tr.text!==t){ outMsg=tr.text; orig=t; jazyk=gl; } }
    catch(e){}
  }
  const mid='out-'+Date.now();
  await sb.from('zpravy').insert({id:mid,konverzace_id:curId,smer:'out',msg:outMsg,preklad:orig,jazyk,ts:new Date().toISOString(),author:'recepce',stav:'pending'}).then(()=>{});
  await sb.from('odpovedi_fronta').insert({konverzace_id:curId,msg:outMsg});
  await sb.from('konverzace').update({last_text:outMsg,last_at:new Date().toISOString(),posledni_smer:'out',unread:0}).eq('id',curId);
  openConv(curId,true); loadConvs();
}
el('reply')?.addEventListener('keydown',e=>{ if(e.key==='Enter'&&!e.shiftKey&&window.innerWidth>780){ e.preventDefault(); sendReply(); } });

if(localStorage.velintym==='1'){ el('pin').classList.add('hide'); boot(); }
</script></body></html>
