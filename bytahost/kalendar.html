async function unlock(pin){
  const km=await crypto.subtle.importKey('raw',new TextEncoder().encode(pin),'PBKDF2',false,['deriveKey']);
  const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:dec(BLOB.s),iterations:BLOB.it,hash:'SHA-256'},
    km,{name:'AES-GCM',length:256},false,['decrypt']);
  const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:dec(BLOB.iv)},key,dec(BLOB.ct));
  return new TextDecoder().decode(pt);
}

  bar.style.cssText='position:fixed;left:14px;bottom:14px;z-index:99999;display:flex;align-items:center;'+
    'font:600 13px system-ui,-apple-system,Segoe UI,sans-serif;background:rgba(20,27,23,.88);color:#fff;'+
    '-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);border:1px solid rgba(255,255,255,.16);'+
    'border-radius:24px;overflow:hidden;box-shadow:0 10px 30px -10px rgba(0,0,0,.55)';
  const back=document.createElement('button');back.textContent='← Zpět';
  back.style.cssText='background:none;border:0;color:#fff;font:inherit;cursor:pointer;padding:9px 15px';
  back.onclick=function(){ if(history.length>1){history.back();} else {location.href=isMaj?'#':'index.html';} };
  bar.appendChild(back);
  if(!isMaj){
    const h=document.createElement('a');h.href='index.html';h.textContent='⌂ VELÍN';
    h.style.cssText='text-decoration:none;color:#fff;padding:9px 15px;border-left:1px solid rgba(255,255,255,.2)';
    bar.appendChild(h);
  }
  document.body.appendChild(bar);
}
async function tryPin(pin,auto){
  try{
    const html=await unlock(pin);
    try{localStorage.setItem(KEYN,pin);}catch(_){ }   // trvale prihlaseni na zarizeni
    document.open();document.write(html);document.close();
    setTimeout(addNav,60);
  }catch(e){
    if(auto){try{localStorage.removeItem(KEYN);}catch(_){}}
    else{document.getElementById('err').textContent='Špatný PIN';}
    const i=document.getElementById('pin');if(i){i.value='';i.focus();}
  }
}
document.getElementById('go').onclick=()=>tryPin(document.getElementById('pin').value);
document.getElementById('pin').addEventListener('keydown',e=>{if(e.key==='Enter')tryPin(e.target.value);});
// pamatuj PIN trvale (localStorage; stary sessionStorage fallback pro plynuly prechod)
const saved=localStorage.getItem(KEYN)||sessionStorage.getItem('velin_pin');
if(saved)tryPin(saved,true);
